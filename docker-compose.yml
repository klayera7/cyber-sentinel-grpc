services:
  sentinel:
    build: .
    container_name: cyber-sentinel
    ports:
      - "50051:50051"
    environment:
      OLLAMA_MODEL: llama3.1
      OLLAMA_HOST: 127.0.0.1:11434
    # Reserva a GPU NVIDIA (Docker Desktop + WSL2). Sem isto, cai em CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
